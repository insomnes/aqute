site_name: Aqute
site_url: https://insomnes.github.io/aqute/
site_description: Async coroutine processing with bounded queues, retries, and rate limits.
repo_url: https://github.com/insomnes/aqute
edit_uri: edit/main/docs/
theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.action.edit
nav:
  - Getting started:
      - Quickstart: index.md
      - Usage guide: usage.md
  - Reference:
      - API reference:
          - Overview: api/index.md
          - Engine: api/engine.md
          - Tasks and counters: api/tasks.md
          - Rate limiters: api/rate-limiters.md
          - Exceptions: api/exceptions.md
          - Worker queues: api/worker-queues.md
      - Behavior and rate limits: reference.md
      - Changelog and migration: https://github.com/insomnes/aqute/blob/main/CHANGELOG.md
  - Recipes:
      - Streaming: streaming.md
      - Resumable batch: resumable_batch.md
      - Retry and progress: retry_progress.md
      - HTTP client: http_client.md
      - LLM inference: llm_inference.md
      - Per-caller request pool: request_pool.md
      - Manual result draining: manual_drain.md
      - Service shutdown: service_shutdown.md
  - Development: development.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            docstring_section_style: list
            heading_level: 2
            show_root_heading: true
            show_source: false
            show_bases: true
            inherited_members: false
            group_by_category: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            line_length: 80
watch:
  - aqute
validation:
  links:
    anchors: warn
markdown_extensions:
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
