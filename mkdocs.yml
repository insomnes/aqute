site_name: Aqute
site_url: https://insomnes.github.io/aqute/
site_description: Async coroutine processing with bounded queues, retries, and rate limits.
repo_url: https://github.com/insomnes/aqute
edit_uri: edit/main/docs/
theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.action.edit
nav:
  - Quickstart: index.md
  - Usage: usage.md
  - Streaming: streaming.md
  - Retry and progress: retry_progress.md
  - HTTP client: http_client.md
  - LLM inference: llm_inference.md
  - Manual result draining: manual_drain.md
  - Service shutdown: service_shutdown.md
  - Development: development.md
markdown_extensions:
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
