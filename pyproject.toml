[project]
name = "aqute"
# Release CI sets this from the GitHub release tag before building.
version = "0.0.0"
description = "Async QUeue Task Engine"
authors = [{ name = "Mikhail Dengin", email = "denginm@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["asyncio", "producer-consumer", "ratelimiting"]
dependencies = []

[project.urls]
Repository = "https://github.com/insomnes/aqute"

[dependency-groups]
dev = [
    "pytest>=8.3.2,<10",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.15,<0.16",
    "ty>=0.0.1,<0.1",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-include = ["tests/**", "Makefile"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["aqute", "tests"]

[tool.ruff]
line-length = 88
indent-width = 4

target-version = "py311"
extend-exclude = [".git", "data"]
force-exclude = true

[tool.ruff.lint]
extend-select = [
    "ARG",
    "B",
    "E",
    "F",
    "I",
    "N",
    "W",
    "ASYNC",
    "C4",
    "C90",
    "ERA",
    "NPY",
    "PERF",
    "PL",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "UP",
]
ignore = [
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"aqute/ratelimiter.py" = [
    "ARG002",
]
"tests/**.py" = [
    "C4",
    "PLR",
    "PERF",
]
